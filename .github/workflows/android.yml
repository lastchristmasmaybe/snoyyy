name: Build & Release Echo APK

on:
  push:
    branches: [main, "ccr-*"]
    paths: ["echo-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) Fast logic tests gate everything: save-on-stop timing, pitch, speaker tracking.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build release APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Echo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Echo-apk
          path: echo-app/Echo.apk
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Echo (latest)
          body: "build-${{ github.run_number }}"
          files: echo-app/Echo.apk
          make_latest: true

  # 2) Real device-style test: record -> Stop -> must be saved. Runs on an emulator; reported separately
  #    so a flaky emulator never blocks shipping, but you can see the result.
  emulator:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: echo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record -> Stop -> saved (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          working-directory: echo-app
          script: gradle connectedDebugAndroidTest --no-daemon
